<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" width="100%" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="msBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021329">
        <animate attributeName="stop-color" values="#021329;#052447;#011833;#021329" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0a3966">
        <animate attributeName="stop-color" values="#0a3966;#02538c;#082a4d;#0a3966" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#010d1c">
        <animate attributeName="stop-color" values="#010d1c;#041f3d;#010d1c" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmer Text Gradient -->
    <linearGradient id="msTextGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff">
        <animate attributeName="offset" values="-1;2" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#0072ff">
        <animate attributeName="offset" values="-0.75;2.25" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#2ed573">
        <animate attributeName="offset" values="-0.5;2.5" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#eccc68">
        <animate attributeName="offset" values="-0.25;2.75" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00c6ff">
        <animate attributeName="offset" values="0;3" dur="3.2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Subtle Sleek Text Glow Filter -->
    <filter id="msGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="msGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 198, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="160" rx="16" fill="url(#msBgGrad)" stroke="rgba(0, 198, 255, 0.3)" stroke-width="1.5"/>
  <rect width="800" height="160" rx="16" fill="url(#msGrid)"/>

  <!-- Animated Data Packet Beams (Left to Right) -->
  <line x1="80" y1="40" x2="720" y2="40" stroke="rgba(0, 198, 255, 0.2)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="80" cy="40" r="4" fill="#00c6ff">
    <animate attributeName="cx" values="80;720" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <line x1="80" y1="120" x2="720" y2="120" stroke="rgba(46, 213, 115, 0.2)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="720" cy="120" r="4" fill="#2ed573">
    <animate attributeName="cx" values="720;80" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Wi-Fi Pulse Arcs -->
  <g transform="translate(100, 80)" fill="none" stroke="#00c6ff" opacity="0.6">
    <path d="M-15,-15 A 20 20 0 0 1 15,-15" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></path>
    <path d="M-25,-25 A 35 35 0 0 1 25,-25" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.4s" repeatCount="indefinite"/></path>
  </g>

  <!-- Main Title -->
  <text x="400" y="72" text-anchor="middle" fill="url(#msTextGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="3" filter="url(#msGlow)">
    🚀 MEGA SHARE 🚀
  </text>

  <!-- Subtitle -->
  <text x="400" y="105" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="1.5">
    Ultra-Fast P2P Wireless File Transfer &amp; Web Sharing
    <animate attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Interactive Accent Line -->
  <rect x="250" y="125" width="300" height="3" rx="1.5" fill="url(#msTextGrad)">
    <animate attributeName="width" values="200;340;200" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="300;230;300" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
