<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" width="100%" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="msBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021329">
        <animate attributeName="stop-color" values="#021329;#052447;#011833;#021329" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#093157">
        <animate attributeName="stop-color" values="#093157;#02487a;#072647;#093157" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#010d1c">
        <animate attributeName="stop-color" values="#010d1c;#041f3d;#010d1c" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmer Text Gradient -->
    <linearGradient id="msTextGrad" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff">
        <animate attributeName="offset" values="-1;2" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#0072ff">
        <animate attributeName="offset" values="-0.75;2.25" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#2ed573">
        <animate attributeName="offset" values="-0.5;2.5" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#eccc68">
        <animate attributeName="offset" values="-0.25;2.75" dur="3.2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00c6ff">
        <animate attributeName="offset" values="0;3" dur="3.2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <pattern id="msGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0, 198, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="160" rx="16" fill="url(#msBgGrad)" stroke="rgba(0, 198, 255, 0.3)" stroke-width="1.5"/>
  <rect width="800" height="160" rx="16" fill="url(#msGrid)"/>

  <!-- Wi-Fi Corner Arcs -->
  <g transform="translate(80, 45)" fill="none" stroke="#00c6ff" opacity="0.6">
    <path d="M-12,-12 A 16 16 0 0 1 12,-12" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></path>
    <path d="M-20,-20 A 28 28 0 0 1 20,-20" stroke-width="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.4s" repeatCount="indefinite"/></path>
  </g>

  <!-- 100% Crisp Title Text with Zero Glow Filter -->
  <text x="400" y="72" text-anchor="middle" fill="url(#msTextGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" letter-spacing="3">
    🚀 MEGA SHARE 🚀
  </text>

  <!-- Subtitle -->
  <text x="400" y="105" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" opacity="0.9">
    Ultra-Fast P2P Wireless File Transfer &amp; Web Sharing
  </text>

  <!-- Interactive Accent Line -->
  <rect x="250" y="124" width="300" height="3" rx="1.5" fill="url(#msTextGrad)"/>
</svg>
